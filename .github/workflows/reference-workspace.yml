name: Reference source diagnostics
on:
  push:
    branches: [feature/maps-terrain]
    paths: [.github/workflows/reference-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bundle tracked authoring sources (no caches or credentials)
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z', 'clients/aonw_godot', '.github/workflows']).decode().split('\0')
          with tarfile.open('reference-sources.tar.gz', 'w:gz') as archive:
              for name in paths:
                  path = pathlib.Path(name)
                  if path.is_file() and not path.is_symlink() and path.suffix in {'.gd', '.gdshader', '.tscn', '.tres', '.py', '.md', '.yml', '.godot', '.gdextension', '.cfg', '.uid'}:
                      archive.add(path, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reference-source-snapshot
          path: reference-sources.tar.gz
          retention-days: 1
