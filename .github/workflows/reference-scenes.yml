name: Reference rendered maps
on:
  push:
    branches: [feature/maps-terrain]
    paths: [clients/aonw_godot/**, .github/workflows/reference-scenes.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-rendered-maps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rendered-maps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: reference-editor-native-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}
      - name: Build native editor boundary
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^channel = / {print $2}' engine/rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal
          (cd engine && cargo build --locked -p aonw_godot --features editor-tools) > reference-scene-build.log 2>&1 || { tail -n 100 reference-scene-build.log; exit 1; }
          mkdir -p clients/aonw_godot/native/linux/x86_64/debug
          cp engine/target/debug/libaonw_godot.so clients/aonw_godot/native/linux/x86_64/debug/
      - name: Install Godot, software renderer and visual assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          release=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$release/Godot_v4.7.1-stable_linux.x86_64.zip" -o Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          sha512sum --ignore-missing --check SHA512-SUMS.txt
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          cd "$GITHUB_WORKSPACE"
          python3 clients/aonw_godot/tool/install_reference_assets.py
      - name: Import and exercise the actual Play entry scene
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64"
          timeout 180 "$godot" --headless --audio-driver Dummy --editor --path clients/aonw_godot --import > reference-scene-import.log 2>&1
          timeout 120 "$godot" --headless --audio-driver Dummy --path clients/aonw_godot --script res://tests/test_landscape_play.gd > reference-scene-play.log 2>&1
          cat reference-scene-play.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR:' reference-scene-import.log reference-scene-play.log; then exit 1; fi
      - name: Guard responsive editor performance and full Play quality
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64"
          timeout 120 xvfb-run -a "$godot" --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --path clients/aonw_godot --script res://tests/test_editor_landscape_performance.gd > reference-scene-performance.log 2>&1
          timeout 180 "$godot" --headless --audio-driver Dummy --editor --path clients/aonw_godot --script res://tests/test_editor_landscape_native.gd > reference-scene-performance-editor.log 2>&1
          timeout 180 "$godot" --headless --audio-driver Dummy --path clients/aonw_godot --script res://tests/test_editor_landscape_native.gd > reference-scene-performance-play.log 2>&1
          cat reference-scene-performance*.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR:' reference-scene-performance*.log; then exit 1; fi
      - name: Validate complete natural forests and water for all bundles
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64"
          timeout 300 "$godot" --headless --audio-driver Dummy --path clients/aonw_godot --script res://tests/test_natural_landscape_maps.gd > reference-scene-natural.log 2>&1
          cat reference-scene-natural.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR:' reference-scene-natural.log; then exit 1; fi
      - name: Check native city footprint and capture its scale
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64"
          timeout 180 xvfb-run -a "$godot" --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --path clients/aonw_godot --script res://tests/test_city_hex_native.gd -- --capture > reference-scene-city.log 2>&1
          cat reference-scene-city.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR:' reference-scene-city.log; then exit 1; fi
      - name: Render all discovered reference maps in Compatibility
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64"
          timeout 600 xvfb-run -a "$godot" --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --path clients/aonw_godot --script res://tool/capture_reference_maps.gd > reference-scene-render.log 2>&1
          cat reference-scene-render.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR:' reference-scene-render.log; then exit 1; fi
          mkdir -p clients/aonw_godot/reference-captures/compatibility
          mv clients/aonw_godot/reference-captures/*.png clients/aonw_godot/reference-captures/compatibility/
      - name: Render Dravonia with Forward Plus
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64"
          timeout 300 xvfb-run -a "$godot" --audio-driver Dummy --rendering-method forward_plus --rendering-driver vulkan --path clients/aonw_godot --script res://tool/capture_reference_maps.gd -- dravonia > reference-scene-forward.log 2>&1
          cat reference-scene-forward.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR:' reference-scene-forward.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-rendered-maps
          path: |
            clients/aonw_godot/reference-captures/**/*.png
            reference-scene-*.log
          retention-days: 7
