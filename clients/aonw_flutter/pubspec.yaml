name: aonw_flutter
description: AoNW Flutter client backed by the native engine protocol.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  aonw_engine_client:
    path: ../../packages/aonw_engine_client
  aonw_server_client:
    path: ../../packages/aonw_server_client
  crypto: 3.0.7
  flame: 1.38.0
  flame_texturepacker: 5.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gamepads: 0.1.10+4
  intl: 0.20.2
  path_provider: 2.1.6
  serverpod_auth_core_client: 3.4.11
  shared_preferences: 2.5.5
  url_launcher: 6.3.2

dev_dependencies:
  analyzer: 12.1.0
  flame_test: 2.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: 4.9.1
  integration_test:
    sdk: flutter
  vm_service: 15.3.0

dependency_overrides:
  gamepads_linux:
    path: plugins/gamepads_linux

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/main_menu/background.jpg
    - assets/runtime/ui/logo.webp
    - assets/runtime/sprites/
    - assets/runtime/sprites/buildings_a/
    - assets/runtime/sprites/buildings_b/
    - assets/runtime/sprites/buildings_c/
    - assets/runtime/sprites/cities/
    - assets/runtime/sprites/dice/
    - assets/runtime/sprites/icons_map/
    - assets/runtime/sprites/improvements_1/
    - assets/runtime/sprites/improvements_2/
    - assets/runtime/sprites/improvements_3/
    - assets/runtime/sprites/improvements_4/
    - assets/runtime/sprites/technologies/
    - assets/runtime/sprites/unit_archer/
    - assets/runtime/sprites/unit_catapult/
    - assets/runtime/sprites/unit_cavalry/
    - assets/runtime/sprites/unit_commander/
    - assets/runtime/sprites/unit_fieldCannon/
    - assets/runtime/sprites/unit_heavyInfantry/
    - assets/runtime/sprites/unit_merchant/
    - assets/runtime/sprites/unit_reconPlane/
    - assets/runtime/sprites/unit_rifleman/
    - assets/runtime/sprites/unit_scout/
    - assets/runtime/sprites/unit_scoutShip/
    - assets/runtime/sprites/unit_settler/
    - assets/runtime/sprites/unit_spearman/
    - assets/runtime/sprites/unit_tank/
    - assets/runtime/sprites/unit_warrior/
    - assets/runtime/sprites/unit_warship/
    - assets/runtime/sprites/unit_worker/
    - assets/runtime/sprites/wonders/
    - assets/maps/aonw2_starter/
    - assets/scenarios/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-VariableFont_wght.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

hooks:
  user_defines:
    aonw_engine_client:
      engine_backend: true
