name: aonw_server
description: Serverpod backend for Age of New Worlds multiplayer.
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  aonw_server_native:
    path: ../packages/aonw_server_native
  crypto: ^3.0.7
  http: ^1.6.0
  serverpod: 3.4.11
  serverpod_auth_core_server: 3.4.11
  serverpod_auth_idp_server: 3.4.11

dev_dependencies:
  lints: ^6.0.0
  serverpod_test: 3.4.11
  test: ^1.31.2
  yaml: ^3.1.3

serverpod:
  scripts:
    start: dart bin/main.dart --apply-migrations
    generate: serverpod generate
