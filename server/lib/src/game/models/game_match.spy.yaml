class: GameMatch
table: aonw_game_match
fields:
  publicId: String
  mapId: String
  mapHash: String
  rulesetId: String
  rulesetHash: String
  mapDocument: String?, scope=serverOnly
  canonicalStateJson: String?, scope=serverOnly
  state: String
  hostPlayerId: String?
  turn: int
  startedAt: DateTime?
  turnDeadlineAt: DateTime?, scope=serverOnly
  endedAt: DateTime?
  outcomeCondition: String?
  winnerPlayerId: String?
  revision: int
  eventOffset: int
  createdAt: DateTime
  updatedAt: DateTime
  participants: List<GameParticipant>?, relation(name=game_match_participants), scope=serverOnly
  commands: List<GameCommandLedger>?, relation(name=game_match_commands), scope=serverOnly
  events: List<GameEvent>?, relation(name=game_match_events), scope=serverOnly
  recipientSnapshots: List<GameRecipientSnapshot>?, relation(name=game_match_recipient_snapshots), scope=serverOnly
indexes:
  aonw_game_match_public_id_idx:
    fields: publicId
    unique: true
  aonw_game_match_updated_idx:
    fields: updatedAt, publicId
  aonw_game_match_started_idx:
    fields: startedAt
  aonw_game_match_turn_deadline_idx:
    fields: turnDeadlineAt, publicId
  aonw_game_match_ended_idx:
    fields: endedAt
